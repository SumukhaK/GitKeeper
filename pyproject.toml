[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitkeeper"
version = "0.1.0"
description = "Local GitHub pull request repair companion"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
ui = ["PySide6", "pytest-qt"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"gitkeeper.ui" = ["qml/*.qml"]
